<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Post.Title}}</title>
    <link rel="shortcut icon" href="/static/favicon.png">
    <link href="/static/css/yinwang.css" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="/static/css/highlightjs/styles/tomorrow.css">
    <script src="/static/js/jquery/jquery.min.js"></script>
    <script async src="//cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="/static/js/highlight.pack.js"></script>
    <script src="/static/js/article.js"></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div style="display: flex; align-items: center; gap: 2rem;">
                <a class="navbar-brand" href="/" onclick="event.preventDefault(); toHome();">Home</a>
                <a href="javascript:toggleToc();" style="color: var(--text-secondary); font-weight: 500; text-decoration: none;">目录</a>
            </div>
            <button class="navbar-toggle" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav">
                    {{range .Navis.Navis}}
                        <li><a href="//{{.Target}}">{{.Name}}</a></li>
                    {{end}}
                </ul>
            </div>
        </div>
    </nav>

    <!-- Table of Contents -->
    <div class="toc-container" id="tocContainer">
        <div class="toc-title">目录</div>
        <div id="toc"></div>
    </div>

    <!-- Article Content -->
    <article class="article-container fade-in">
        <header class="article-header">
            <h1 class="article-title">{{.Post.Title}}</h1>
            <div class="article-meta">
                <span>阅读时间约 {{.Post.Content | readTime}} 分钟</span>
            </div>
        </header>

        <div class="article-content" id="article">
            {{.Post.Content | markup}}
        </div>
    </article>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; {{.Year}} AbbyCin</p>
        </div>
    </footer>

    <script>
        // Mobile menu toggle
        function toggleMenu() {
            const menu = document.getElementById('navbarMenu');
            menu.classList.toggle('active');
        }

        // Toggle TOC visibility
        function toggleToc() {
            const toc = document.getElementById('tocContainer');
            toc.style.display = toc.style.display === 'none' ? 'block' : 'none';
        }

        // Navigate to home
        function toHome() {
            window.location.href = "/";
        }

        // Send view count
        function sendCount(id) {
            fetch(`/article/${id}`, {method: 'PUT'})
                .then(function(j) { return j.text(); })
                .then(function(res) { console.log(res); })
                .catch(function(e) { console.log(e); });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Detect mobile
            if (/mobile/i.test(navigator.userAgent) || /android/i.test(navigator.userAgent)) {
                document.body.classList.add('mobile');
                document.getElementById('tocContainer').style.display = 'none';
            }

            // Generate TOC
            if (typeof create_toc === 'function') {
                create_toc();
            }

            // Initialize highlight.js - highlight all code blocks
            if (typeof hljs !== 'undefined') {
                document.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightBlock(block);
                });
            }

            // Send view count
            setTimeout(function() {
                sendCount({{.Post.Id}});
            }, 1000);
        });

        // Close menu when clicking outside
        document.addEventListener('click', function(e) {
            const navbar = document.querySelector('.navbar');
            const menu = document.getElementById('navbarMenu');
            if (!navbar.contains(e.target) && menu.classList.contains('active')) {
                menu.classList.remove('active');
            }
        });
    </script>
</body>
</html>
